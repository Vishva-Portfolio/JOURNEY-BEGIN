<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Journey Begin</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<!-- ============ LOGIN SCREEN ============ -->
<div class="admin-login" id="loginScreen">
  <form class="admin-login-card facet" id="loginForm">
    <div class="admin-login-brand">
      <span class="logo-mark">◈</span>
      <span class="logo-text">JOURNEY<em>BEGIN</em></span>
    </div>
    <p class="admin-login-sub">Admin sign in</p>

    <label class="admin-field">
      <span>Email</span>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label class="admin-field">
      <span>Password</span>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </label>

    <button type="submit" class="btn btn-primary admin-login-btn" id="loginBtn">
      <span>Sign In</span>
    </button>
    <p class="admin-login-error" id="loginError"></p>
    <p class="admin-login-note">Accounts are created in the Firebase Console — there is no public sign-up.</p>
  </form>
</div>

<!-- ============ DASHBOARD (hidden until authenticated) ============ -->
<div class="admin-dash" id="dashScreen" hidden>

  <header class="admin-topbar">
    <a href="../index.html" class="admin-brand">
      <span class="logo-mark">◈</span>
      <span class="logo-text">JOURNEY<em>BEGIN</em></span>
      <span class="admin-pill">ADMIN</span>
    </a>
    <div class="admin-topbar-right">
      <span class="admin-user" id="adminUserEmail"></span>
      <a href="../index.html" class="admin-btn admin-btn-ghost" target="_blank" rel="noopener">View Site</a>
      <button class="admin-btn admin-btn-ghost" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <div class="admin-layout">
    <nav class="admin-sidebar" id="adminSidebar">
      <!-- tab buttons injected by admin.js -->
    </nav>

    <main class="admin-main">
      <div class="admin-main-head">
        <h1 id="panelTitle">Manga</h1>
        <div class="admin-main-actions">
          <button class="admin-btn admin-btn-ghost" id="seedBtn">Seed Default Content</button>
          <button class="admin-btn admin-btn-primary" id="addBtn">+ Add New</button>
        </div>
      </div>
      <p class="admin-status" id="adminStatus"></p>
      <div class="admin-table-wrap">
        <table class="admin-table" id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <p class="admin-empty" id="tableEmpty" hidden>Nothing here yet.</p>
      </div>
    </main>
  </div>
</div>

<!-- ============ ADD/EDIT MODAL ============ -->
<div class="admin-modal-overlay" id="modalOverlay" hidden>
  <div class="admin-modal facet" id="modalCard">
    <div class="admin-modal-head">
      <h2 id="modalTitle">Add Item</h2>
      <button class="admin-btn admin-btn-icon" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <form id="modalForm">
      <div class="admin-modal-fields" id="modalFields"></div>
      <p class="admin-modal-error" id="modalError"></p>
      <div class="admin-modal-actions">
        <button type="button" class="admin-btn admin-btn-ghost" id="modalDelete" hidden>Delete</button>
        <span class="admin-modal-spacer"></span>
        <button type="button" class="admin-btn admin-btn-ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="admin-btn admin-btn-primary" id="modalSave">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
